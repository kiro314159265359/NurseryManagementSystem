version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: nursery_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nursery_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nursery_network

  # .NET API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nursery_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: ${DATABASE_URL}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-NurseryManagementSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-NurseryManagementSystem}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRY:-60}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRY:-7}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nursery_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  nursery_network:
    driver: bridge
