services:
  # PostgreSQL Database Service
  - type: pserv
    name: nursery-management-db
    env: docker
    plan: free
    databaseName: nursery_management
    postgresUser: postgres
    postgresPassword: 
      - type: password
        name: POSTGRES_PASSWORD
    numConns: 10
    version: "18"
    region: oregon
  
  # Web API Service
  - type: web
    name: nursery-management-api
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ConnectionStrings__DefaultConnection
        fromService:
          type: pserv
          name: nursery-management-db
          property: connectionString
      - key: Jwt__Issuer
        value: NurseryManagementSystem
      - key: Jwt__Audience
        value: NurseryManagementSystem
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__AccessTokenExpirationMinutes
        value: "60"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"
